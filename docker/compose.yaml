services:
    app-dev:
        profiles: [app]
        build:
            context: ..
            dockerfile: docker/app.Dockerfile
        ports:
            - "127.0.0.1:${APP_PORT}:80"
        environment:
            APP_ENV: development
            MYSQL_HOST: mysql
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            POSTGRES_HOST: postgres
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
            REDIS_HOST: redis
        volumes:
            - type: bind
              source: ${LORI_ROOT}
              target: /app

    app-run:
        profiles: [app]
        build:
            context: ..
            dockerfile: docker/app.Dockerfile
        ports:
            - "127.0.0.1:${APP_PORT}:80"
        environment:
            APP_ENV: production
            MYSQL_HOST: mysql
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            POSTGRES_HOST: postgres
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
            REDIS_HOST: redis

    mysql:
        image: mysql:8.4
        ports:
            - "127.0.0.1:${MYSQL_PORT}:3306"
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        volumes:
            - type: bind
              source: ${LORI_ROOT}/.docker-data/mysql
              target: /var/lib/mysql

    mongodb:
        image: mongo:8
        ports:
            - "127.0.0.1:${MONGODB_PORT}:27017"
        environment:
            MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
            MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
        volumes:
            - type: bind
              source: ${LORI_ROOT}/.docker-data/mongodb
              target: /data/db

    postgres:
        image: postgres:16
        ports:
            - "127.0.0.1:${POSTGRES_PORT}:5432"
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - type: bind
              source: ${LORI_ROOT}/.docker-data/postgres
              target: /var/lib/postgresql/data

    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "yes"]
        ports:
            - "127.0.0.1:${REDIS_PORT}:6379"
        volumes:
            - type: bind
              source: ${LORI_ROOT}/.docker-data/redis
              target: /data

    phpmyadmin:
        build:
            context: ..
            dockerfile: docker/phpmyadmin.Dockerfile
        ports:
            - "127.0.0.1:${PHPMYADMIN_PORT}:80"
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306

    adminer:
        image: adminer:5
        ports:
            - "127.0.0.1:${ADMINER_PORT}:8080"

    mongo-express:
        image: mongo-express:1.0.2
        ports:
            - "127.0.0.1:${MONGO_EXPRESS_PORT}:8081"
        environment:
            ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
            ME_CONFIG_BASICAUTH_ENABLED: "true"
            ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER}
            ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}

    redisinsight:
        image: redis/redisinsight:3.8.0
        ports:
            - "127.0.0.1:${REDISINSIGHT_PORT}:5540"
        volumes:
            - type: bind
              source: ${LORI_ROOT}/.docker-data/redisinsight
              target: /data
